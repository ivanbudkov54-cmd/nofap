<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Вход — Spartan Pro</title>
<meta name="theme-color" content="#0A0A0D">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="assets/site.css">
<script>
(function () {
  function payload() {
    var hash = (location.hash || "").replace(/^#/, "");
    var search = (location.search || "").replace(/^\?/, "");
    if (hash.indexOf("access_token=") !== -1 || hash.indexOf("error=") !== -1 || hash.indexOf("error_code=") !== -1) {
      return hash;
    }
    if (search.indexOf("access_token=") !== -1 || search.indexOf("error=") !== -1 || search.indexOf("error_code=") !== -1) {
      return search;
    }
    return hash || search;
  }
  var data = payload();
  if (data) {
    try { sessionStorage.setItem("spartan_auth", data); } catch (e) {}
    location.replace("nofap://auth?" + data);
  }
})();
</script>
</head>
<body class="thanks">
<main>
  <span class="eyebrow">Вход</span>
  <h1>Открываем приложение.</h1>
  <p>Нажмите ссылку в письме — StopFap откроется сам. Если этого не произошло, нажмите кнопку.</p>
  <a class="btn btn-gold" id="open-app" href="nofap://auth">Открыть приложение</a>
</main>
<script>
  (function () {
    var link = document.getElementById("open-app");
    var data = "";
    try { data = sessionStorage.getItem("spartan_auth") || ""; } catch (e) {}
    if (!data) {
      var hash = (location.hash || "").replace(/^#/, "");
      var search = (location.search || "").replace(/^\?/, "");
      data = hash || search;
    }
    if (data) link.href = "nofap://auth?" + data;
  })();
</script>
</body>
</html>
