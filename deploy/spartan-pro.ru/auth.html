<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Вход — Spartan Pro</title>
<meta name="theme-color" content="#0A0A0D">
<link rel="stylesheet" href="assets/site.css">
<script>
(function () {
  var hash = location.hash || "";
  var search = location.search || "";
  var payload = "";
  if (hash.indexOf("access_token=") !== -1) payload = hash.replace(/^#/, "");
  else if (search.indexOf("access_token=") !== -1) payload = search.replace(/^\?/, "");
  if (payload) location.replace("nofap://auth?" + payload);
})();
</script>
</head>
<body class="thanks">
<main>
  <span class="eyebrow">Вход</span>
  <h1>Открываем приложение.</h1>
  <p>Если StopFap не открылся сам, нажмите кнопку. На симуляторе вставьте ссылку из письма в Safari симулятора.</p>
  <a class="btn btn-gold" id="open-app" href="nofap://auth">Открыть приложение</a>
</main>
<script>
  var link = document.getElementById("open-app");
  var payload = (location.hash || "").replace(/^#/, "") || (location.search || "").replace(/^\?/, "");
  if (payload.indexOf("access_token=") !== -1) link.href = "nofap://auth?" + payload;
</script>
</body>
</html>
